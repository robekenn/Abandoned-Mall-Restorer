name: Build packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build, smoke-test and archive
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.os }}
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 14
