name: Prepare release

on:
  push:
    branches: [main]
    paths: [VERSION, .github/workflows/release.yml]

    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    uses: ./.github/workflows/ci.yml
  prepare-release:
    needs: validate-and-build
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: game-*
          path: release-assets
          merge-multiple: true
      - name: Verify all platform archives and checksums
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          assets = Path('release-assets')
          for pattern in ('MallRestorer-windows-*.zip', 'MallRestorer-linux-*.tar.gz', 'MallRestorer-darwin-*.tar.gz'):
              matches = list(assets.glob(pattern))
              assert len(matches) == 1, f'Expected one archive for {pattern}'
              checksum = matches[0].with_name(matches[0].name + '.sha256')
              assert checksum.is_file(), 'Missing checksum'
              # Accept checksum files from older Windows builds as well.
              checksum.write_bytes(checksum.read_bytes().replace(b'\r\n', b'\n'))
          PY
          cd release-assets
          sha256sum --check *.sha256
      - name: Create release with downloads
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ "$RELEASE_REF" == refs/heads/main ]]; then
            version="$(tr -d '\r\n' < VERSION)"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid VERSION'; exit 1; }
            tag="v$version"
            notes="docs/releases/$tag.md"
            [[ -f "$notes" ]] || { echo "Missing release notes: $notes"; exit 1; }
            title="$tag — First Playable Preview"
            args=(--target "$RELEASE_SHA" --prerelease --notes-file "$notes")
            publish=true
          else
            tag="${RELEASE_REF#refs/tags/}"
            title="$tag"
            args=(--verify-tag --generate-notes)
            publish=false
          fi
          if tag_sha="$(gh api "repos/$REPOSITORY/commits/$tag" --jq .sha 2>/dev/null)"; then
            [[ "$tag_sha" == "$RELEASE_SHA" ]] || { echo 'Refusing to reuse a tag from another commit'; exit 1; }
          fi
          if gh release view "$tag" --json isDraft > release.json; then
            python3 -c "import json; assert json.load(open('release.json'))['isDraft'], 'Refusing to modify a published release'"
          else
            gh release create "$tag" --draft --title "$title" "${args[@]}"
          fi
          gh release upload "$tag" release-assets/* --clobber
          if [[ "$publish" == true ]]; then
            gh release edit "$tag" --draft=false --prerelease --title "$title" --notes-file "$notes"
          fi
